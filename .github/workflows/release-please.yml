name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          release-type: node

      - name: Assign release PRs
        if: ${{ steps.release.outputs.prs_created == 'true' }}
        uses: actions/github-script@v7
        env:
          RELEASE_PRS: ${{ steps.release.outputs.prs }}
          ASSIGNEE: ElianCodes
        with:
          script: |
            const prs = JSON.parse(process.env.RELEASE_PRS || '[]');
            for (const pr of prs) {
              await github.rest.issues.addAssignees({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                assignees: [process.env.ASSIGNEE],
              });
            }

  publish:
    name: Publish to npm
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # required for npm trusted publishing (OIDC)
    outputs:
      published_version: ${{ steps.package-version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Read package version
        id: package-version
        run: node -p "'version=' + require('./package.json').version" >> "$GITHUB_OUTPUT"

      - name: Publish
        # Trusted publishing (OIDC): npm exchanges the workflow's OIDC token for
        # a short-lived registry token, so no NPM_TOKEN is needed. Uses npm
        # rather than pnpm because the pnpm fixes for OIDC alongside the .npmrc
        # that actions/setup-node writes only landed in pnpm 11.1.3.
        run: npm publish --access public --provenance

  propagate:
    name: Propagate dependency bump
    needs: [release-please, publish]
    if: needs.release-please.outputs.release_created
    uses: ./.github/workflows/propagate-dependency.yml
    with:
      version: ${{ needs.publish.outputs.published_version }}
    secrets: inherit
