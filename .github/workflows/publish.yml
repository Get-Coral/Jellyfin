name: Manual Publish

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Tag to publish (e.g. v1.7.0)
        required: true

permissions:
  contents: read
  id-token: write   # required for npm trusted publishing (OIDC)

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Publish
        # Trusted publishing (OIDC): npm exchanges the workflow's OIDC token for
        # a short-lived registry token, so no NPM_TOKEN is needed. Uses npm
        # rather than pnpm because the pnpm fixes for OIDC alongside the .npmrc
        # that actions/setup-node writes only landed in pnpm 11.1.3.
        run: npm publish --access public --provenance
